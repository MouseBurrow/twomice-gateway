[package]
name = "gateway"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.100"
axum = "0.7"
config = { git = "https://github.com/MouseBurrow/twomice-libs.git", branch = "main" }
custom_headers = { git = "https://github.com/MouseBurrow/twomice-libs.git", branch = "main" }
env_logger = "0.11.8"
http = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
